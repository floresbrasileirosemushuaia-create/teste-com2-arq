<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perla Andina | Portal B2B</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f7f9;color:#17324d}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(520px,100%);background:#fff;border:1px solid #d9e3e8;border-radius:20px;padding:22px;box-shadow:0 10px 32px rgba(23,50,77,.08);text-align:center}.spin{width:34px;height:34px;border:4px solid #dce9ef;border-top-color:#24789c;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:18px;margin:0 0 7px}p{font-size:12px;color:#617480;margin:0;line-height:1.5}.error{display:none;color:#b3261e;margin-top:14px;white-space:pre-wrap}.actions{display:none;margin-top:16px;gap:8px;justify-content:center;flex-wrap:wrap}.actions a,.actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer;background:#17324d;color:#fff}.actions a.alt{background:#e9f2f6;color:#24789c}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="box"><div class="spin" id="spin"></div><h1>Perla Andina B2B</h1><p>Conectando o Vercel ao Apps Script…</p><div class="error" id="err"></div><div class="actions" id="actions"><button onclick="location.reload()">Tentar novamente</button><a class="alt" href="/control">Abrir diagnóstico</a></div></div></div>
<script>
(async()=>{try{const r=await fetch('/api/ui?v=244',{cache:'no-store'});const html=await r.text();if(!r.ok||!/^\s*<!doctype html>|^\s*<html/i.test(html))throw new Error('UI do Apps Script indisponível. HTTP '+r.status+'\n'+html.slice(0,240));document.open();document.write(html);document.close()}catch(e){document.getElementById('spin').style.display='none';const er=document.getElementById('err');er.style.display='block';er.textContent=String(e&&e.message||e);document.getElementById('actions').style.display='flex'}})();
</script>
</body>
</html>
