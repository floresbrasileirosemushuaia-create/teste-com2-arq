<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><link rel="manifest" href="/manifest.webmanifest"><title>Perla Andina | Portal B2B</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7f9;color:#17324d}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #dce6eb;border-radius:22px;padding:28px;box-shadow:0 14px 44px rgba(23,50,77,.1);text-align:center}.spin{width:38px;height:38px;border:4px solid #dce6eb;border-top-color:#17324d;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#617281;line-height:1.5}button{border:0;border-radius:12px;background:#17324d;color:#fff;font-weight:800;padding:12px 18px;cursor:pointer}</style></head><body><main class="boot"><section class="card"><div class="spin"></div><h1>Perla Andina B2B</h1><p id="msg">Carregando o Portal…</p><button id="retry" hidden onclick="location.reload()">Tentar novamente</button></section></main><script>(async()=>{try{const r=await fetch('/api/ui',{cache:'no-store'}),html=await r.text();if(!r.ok||!html.includes('PERLA ANDINA'))throw new Error('UI indisponível');document.open();document.write(html);document.close()}catch(e){document.querySelector('.spin').style.display='none';document.getElementById('msg').textContent='Não foi possível carregar o Portal. Tente novamente em alguns segundos.';document.getElementById('retry').hidden=false}})();</script></body></html>
